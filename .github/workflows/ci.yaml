# Validates the Compose configuration and shell scripts.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-compose:
    name: Validate compose.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from template
        run: cp .env.example .env
      - name: docker compose config
        run: docker compose -f compose.yaml config >/dev/null

  shellcheck:
    name: Shellcheck scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck scripts/*.sh

  engine:
    name: Build and test engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  gateway:
    name: Build and test gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build
        run: go build ./...
        working-directory: gateway
      - name: Vet
        run: go vet ./...
        working-directory: gateway
      - name: Test
        run: go test ./...
        working-directory: gateway
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
        working-directory: gateway
